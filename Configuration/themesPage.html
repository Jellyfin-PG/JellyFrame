<!DOCTYPE html>
<html lang="en">

<head>
    <title>JellyFrame - Themes</title>
</head>

<body>

        <style>

                --mui-palette-info-main: #29b6f6;

                --mui-palette-bg-paper: #1e1e1e;
                --mui-palette-bg-elevated: #262626;
                --mui-palette-text-primary: rgba(255, 255, 255, 0.87);

            .jfThemePage {

                color: var(--mui-palette-text-primary) !important;
                box-sizing: border-box !important;
                padding: 16px 24px !important;
                max-width: 1300px !important;
                margin: 0 auto !important;
            }

            .jfThemePage h2 {
                font-size: 2.0rem !important;
                font-weight: 600 !important;
                line-height: 1.25 !important;
                letter-spacing: -0.00833em !important;
                margin: 0 0 20px 0 !important;
                color: var(--mui-palette-text-primary) !important;
            }

            /* MUI Tabs Navigation */
            .jfThemePage .mui-tabs {
                display: flex !important;
                flex-direction: row !important;
                gap: 0 !important;
                margin-bottom: 24px !important;

                padding-bottom: 0 !important;
                width: 100% !important;
                min-height: 48px !important;
                box-sizing: border-box !important;

            .jfThemePage .jfThemeTab,

                all: unset !important;
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                gap: 8px !important;
                min-height: 48px !important;
                min-width: 90px !important;
                padding: 12px 20px !important;
                border: none !important;
                background: transparent !important;
                cursor: pointer !important;
                border-bottom: 2px solid transparent !important;
                margin-bottom: -1px !important;

                font-family: inherit !important;

                font-weight: 500 !important;

                user-select: none !important;

                border-top-right-radius: var(--mui-shape-radius-sm) !important;

            .jfThemePage .jfThemeTab:hover,
            .jfThemePage .mui-tab:hover {
                color: var(--mui-palette-text-primary) !important;
                background-color: rgba(255, 255, 255, 0.04) !important;
            }

            .jfThemePage .jfThemeTab:focus-visible,
            .jfThemePage .mui-tab:focus-visible {
                outline: 2px solid var(--mui-palette-primary-main) !important;
                outline-offset: -2px !important;
            }

            .jfThemePage .jfThemeTab.jfThemeTabActive,
            .jfThemePage .jfThemeTabActive,
            .jfThemePage .mui-tab-active {
                color: var(--mui-palette-primary-main) !important;
                border-bottom: 2px solid var(--mui-palette-primary-main) !important;
                font-weight: 600 !important;
                background-color: transparent !important;
            }

            .jfThemePage .mui-tab-icon {
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                font-size: 1.1rem !important;
                line-height: 1 !important;
            }

            /* MUI Alert Banners */
            .jfThemePage .mui-alert-banner {
                display: flex;
                align-items: center !important;
                gap: 12px !important;
                padding: 12px 18px !important;
                border-radius: var(--mui-shape-radius-md) !important;
                margin-bottom: 20px !important;
                font-size: 0.875rem !important;
                line-height: 1.5 !important;
                transition: all 200ms ease !important;
                box-sizing: border-box !important;
            }

            .jfThemePage .mui-alert-banner-info {
                background-color: rgba(144, 202, 249, 0.1) !important;
                border: 1px solid rgba(144, 202, 249, 0.3) !important;
                color: var(--mui-palette-primary-main) !important;
            }

            .jfThemePage .mui-alert-banner-warning {
                background-color: rgba(255, 167, 38, 0.1) !important;
                border: 1px solid rgba(255, 167, 38, 0.35) !important;
                color: var(--mui-palette-warning-main) !important;
            }

            /* MUI Outlined Inputs & Form Controls */
            .jfThemePage .inputContainer,
            .jfThemePage .selectContainer {
                margin-bottom: 16px !important;
            }

            .jfThemePage .inputLabel,
            .jfThemePage .selectLabel {
                font-size: 0.75rem !important;
                font-weight: 600 !important;
                color: var(--mui-palette-text-secondary) !important;
                margin-bottom: 6px !important;
                display: block !important;
                letter-spacing: 0.01em !important;
                text-transform: uppercase !important;
            }

            .jfThemePage input.emby-input,
            .jfThemePage select.emby-select {
                width: 100% !important;
                padding: 10px 14px !important;
                background-color: rgba(255, 255, 255, 0.04) !important;
                border: 1px solid rgba(255, 255, 255, 0.23) !important;
                border-radius: var(--mui-shape-radius-md) !important;
                color: var(--mui-palette-text-primary) !important;
                font-family: inherit !important;
                font-size: 0.875rem !important;
                box-sizing: border-box !important;
                transition: border-color 200ms cubic-bezier(0.4, 0, 0.2, 1), box-shadow 200ms ease, background-color 200ms ease !important;
            }

            .jfThemePage input.emby-input:hover,
            .jfThemePage select.emby-select:hover {
                border-color: rgba(255, 255, 255, 0.4) !important;
                background-color: rgba(255, 255, 255, 0.06) !important;
            }

            .jfThemePage input.emby-input:focus,
            .jfThemePage select.emby-select:focus {
                border-color: var(--mui-palette-primary-main) !important;
                outline: none !important;
                box-shadow: 0 0 0 1px var(--mui-palette-primary-main) !important;
                background-color: rgba(255, 255, 255, 0.07) !important;
            }

            /* MUI Buttons */
            .jfThemePage .mui-btn-contained,
            button.mui-btn-contained,
            a.mui-btn-contained {
                all: unset !important;
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                background-color: var(--mui-palette-primary-main) !important;
                color: var(--mui-palette-primary-contrast) !important;
                font-family: inherit !important;
                font-weight: 600 !important;
                padding: 8px 22px !important;
                font-size: 0.875rem !important;
                line-height: 1.75 !important;
                letter-spacing: 0.02857em !important;
                text-transform: uppercase !important;
                border-radius: var(--mui-shape-radius-md) !important;
                border: none !important;
                cursor: pointer !important;
                box-shadow: var(--mui-shadow-elevation-2) !important;
                transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1) !important;
                text-decoration: none !important;
                user-select: none !important;
                box-sizing: border-box !important;
            }

            .jfThemePage .mui-btn-contained:hover:not(:disabled),
            button.mui-btn-contained:hover:not(:disabled) {
                background-color: var(--mui-palette-primary-dark) !important;
                box-shadow: var(--mui-shadow-elevation-4) !important;
            }

            .jfThemePage .mui-btn-contained:active:not(:disabled) {
                transform: scale(0.98) !important;
            }

            .jfThemePage .mui-btn-contained:disabled,
            button.mui-btn-contained:disabled {
                background-color: rgba(255, 255, 255, 0.12) !important;
                color: rgba(255, 255, 255, 0.3) !important;
                box-shadow: none !important;
                cursor: default !important;
                pointer-events: none !important;
            }

            .jfThemePage .mui-btn-outlined,
            button.mui-btn-outlined,
            a.mui-btn-outlined {
                all: unset !important;
                display: inline-flex !important;
                align-items: center !important;
                justify-content: center !important;
                background-color: transparent !important;
                color: var(--mui-palette-primary-main) !important;
                border: 1px solid rgba(144, 202, 249, 0.5) !important;
                font-family: inherit !important;
                font-weight: 600 !important;
                padding: 7px 18px !important;
                font-size: 0.875rem !important;
                line-height: 1.75 !important;
                letter-spacing: 0.02857em !important;
                text-transform: uppercase !important;
                border-radius: var(--mui-shape-radius-md) !important;
                cursor: pointer !important;
                transition: all 200ms cubic-bezier(0.4, 0, 0.2, 1) !important;
                text-decoration: none !important;
                user-select: none !important;
                box-sizing: border-box !important;
            }

            .jfThemePage .mui-btn-outlined:hover:not(:disabled),
            button.mui-btn-outlined:hover:not(:disabled) {
                background-color: rgba(144, 202, 249, 0.08) !important;
                border-color: var(--mui-palette-primary-main) !important;
            }

            .jfThemePage .mui-btn-outlined-danger,
            button.mui-btn-outlined-danger {
                color: var(--mui-palette-error-main) !important;
                border-color: rgba(244, 67, 54, 0.5) !important;
                background-color: rgba(244, 67, 54, 0.04) !important;
            }

            .jfThemePage .mui-btn-outlined-danger:hover:not(:disabled),
            button.mui-btn-outlined-danger:hover:not(:disabled) {
                background-color: rgba(244, 67, 54, 0.12) !important;
                border-color: var(--mui-palette-error-main) !important;
            }

            /* MUI Cards Grid */
            .jfThemePage #themeGrid,
            #themeGrid {
                display: grid !important;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important;
                gap: 20px !important;
                padding: 16px 0 24px 0 !important;
                margin: 0 !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }

            /* MUI Card Containers */
            .jfThemePage .card,
            .jfThemePage .mui-card {
                background-color: var(--mui-palette-bg-paper) !important;
                border-radius: var(--mui-shape-radius-lg) !important;
                border: 1px solid var(--mui-palette-divider) !important;
                box-shadow: var(--mui-shadow-elevation-1) !important;
                display: flex !important;
                flex-direction: column !important;
                overflow: hidden !important;
                margin: 0 !important;
                width: 100% !important;
                min-width: 0 !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
                position: relative !important;
                pointer-events: auto !important;
                transition: box-shadow 250ms cubic-bezier(0.4, 0, 0.2, 1), transform 200ms ease, border-color 250ms ease !important;
            }

            .jfThemePage .card:hover,
            .jfThemePage .mui-card:hover {
                box-shadow: var(--mui-shadow-elevation-4) !important;
                border-color: rgba(144, 202, 249, 0.4) !important;
                transform: translateY(-2px) !important;
            }

            .jfThemePage .card.activeRing {
                border-color: var(--mui-palette-primary-main) !important;
                box-shadow: 0 0 0 1px var(--mui-palette-primary-main), var(--mui-shadow-elevation-2) !important;
            }

            .jfThemePage .card.activeRing .cardBox {
                outline: none !important;
            }

            .jfThemePage .card.editorsChoiceCard {
                border-color: rgba(255, 167, 38, 0.6) !important;
            }

            .jfThemePage .card.editorsChoiceCard.activeRing {
                border-color: var(--mui-palette-primary-main) !important;
            }

            .jfThemePage #jft-tabSettings .card,
            .jfThemePage #jft-tabSettings .mui-card,
            .jfThemePage #jft-tabSettings>div,
            #jft-tabSettings .card,
            #jft-tabSettings .mui-card,
            #jft-tabSettings>div {
                margin: 0 0 24px 0 !important;
                padding: 24px !important;
            }

            .jfThemePage #jft-tabSettings>div:last-child,
            #jft-tabSettings>div:last-child {
                margin-bottom: 0 !important;
            }

            .jfThemePage .cardBox,
            .jfThemePage .cardScalable,
            .jfThemePage .cardPadder,
            .jfThemePage .cardContent {
                display: flex !important;
                flex-direction: column !important;
                flex: 1 1 auto !important;
                width: 100% !important;
                height: 100% !important;
                min-height: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                background: transparent !important;
                border: none !important;
                border-radius: 0 !important;
                outline: none !important;
                box-shadow: none !important;
                pointer-events: auto !important;
                position: relative !important;
            }

            .jfThemePage .cardImageContainer {
                display: block !important;
                width: 100% !important;
                height: 160px !important;
                min-height: 160px !important;
                max-height: 160px !important;
                flex: 0 0 160px !important;
                position: relative !important;
                overflow: hidden !important;
                background-size: cover !important;
                background-position: top center !important;
                background-color: rgba(0, 0, 0, 0.35) !important;
                border-top-left-radius: var(--mui-shape-radius-lg) !important;
                border-top-right-radius: var(--mui-shape-radius-lg) !important;
                box-sizing: border-box !important;
            }

            .jfThemePage .cardImageContainer img {
                position: absolute !important;
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 160px !important;
                min-height: 160px !important;
                max-height: 160px !important;
                object-fit: cover !important;
                object-position: top center !important;
                display: block !important;
                pointer-events: none !important;
            }

            .jfThemePage .cardFooter {
                display: flex !important;
                flex-direction: column !important;
                flex: 1 1 auto !important;
                padding: 14px 16px !important;
                background: transparent !important;
                box-sizing: border-box !important;
            }

            /* MUI Badges on Theme Cards */
            .jfThemePage .themeTypeBadge {
                position: absolute;
                top: 10px;
                left: 10px;
                padding: 3px 8px;
                border-radius: var(--mui-shape-radius-sm);
                font-size: 10px;
                font-weight: 700;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                z-index: 2;
                pointer-events: none;
                background: rgba(41, 182, 246, 0.9);
                color: #000;
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
            }

            .jfThemePage .activeCheck {
                position: absolute;
                top: 8px;
                right: 8px;
                background: var(--mui-palette-primary-main);
                color: #000;
                border-radius: 50%;
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 13px;
                font-weight: 800;
                z-index: 2;
                pointer-events: none;
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            }

            .jfThemePage .stateMsg {
                grid-column: 1 / -1;
                padding: 48px 16px;
                text-align: center;
                color: var(--mui-palette-text-secondary);
                font-size: 0.95rem;
            }

            .jfThemePage .editorsBadge {
                position: absolute;
                top: 104px;
                right: 10px;
                z-index: 10;
                width: 24px;
                height: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: linear-gradient(135deg, #ffa726, #f57c00);
                border: 1px solid rgba(255, 255, 255, 0.4);
                border-radius: 50%;
                font-size: 12px;
                color: #000;
                pointer-events: auto;
                cursor: default;
                box-shadow: 0 2px 6px rgba(245, 124, 0, 0.5);
                animation: jfEcShimmer 3s ease-in-out infinite;
            }

            @keyframes jfEcShimmer {

                0%,
                100% {
                    box-shadow: 0 1px 6px rgba(245, 124, 0, 0.5);
                }

                50% {
                    box-shadow: 0 1px 16px rgba(255, 167, 38, 0.9);
                }
            }
        </style>

        <div data-role="content">
            <div class="content-primary">

                <h2>Themes</h2>

                <div id="jfThemeTabs" class="mui-tabs" role="tablist">
                    <button type="button" class="jfThemeTab jfThemeTabActive mui-tab mui-tab-active" data-tab="themes"
                        role="tab" aria-selected="true" tabindex="0">
                        <span class="mui-tab-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path

                            </svg>

                    <button type="button" class="jfThemeTab mui-tab" data-tab="settings" role="tab"

                        <span class="mui-tab-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                <path

                    </div>

                        <label class="inputLabel" for="themesUrl">Theme Repository URL</label>

                    </div>
                    <div style="margin-bottom:1.75rem">
                        <button type="button" id="jft-btnLoad" class="mui-btn-contained">Load Themes</button>
                    </div>

                            <input type="text" id="jft-searchInput" class="emby-input" placeholder="Search themes…" />
                        </div>

    statusBar.appendChild(langLabel);

        if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', onKey); }
    });
    document.body.appendChild(overlay);

    var files = [];
    var activeIdx = 0;
    var dirty = false;

    function setDirty(val) {
        dirty = val;
        saveBtn.style.background = val ? '#ffa726' : '#90caf9';
        saveBtn.style.color = 'rgba(0,0,0,0.87)';
        saveStatus.textContent = val ? 'Unsaved changes' : '';
    }

    textarea.addEventListener('input', function () { setDirty(true); });

    function loadTab(idx) {
        if (files.length === 0) return;
        if (dirty) {
            files[activeIdx].pendingContent = textarea.value;
        }
        activeIdx = idx;
        var f = files[idx];
        textarea.value = f.pendingContent !== undefined ? f.pendingContent : (f.content || '');
        langLabel.textContent = (f.lang || '').toUpperCase();
        fileLabel.textContent = f.filename || '';
        sizeLabel.textContent = ((f.content || '').length / 1024).toFixed(1) + ' KB';
        setDirty(f.pendingContent !== undefined);

        var tabs = tabStrip.querySelectorAll('[data-tab-idx]');
        for (var i = 0; i < tabs.length; i++) {
            var active = parseInt(tabs[i].getAttribute('data-tab-idx')) === idx;
            tabs[i].style.background = active ? '#1e1e1e' : 'transparent';
            tabs[i].style.borderBottom = active ? '2px solid #90caf9' : '2px solid transparent';
            tabs[i].style.color = active ? '#90caf9' : 'rgba(255,255,255,0.6)';
        }
        textarea.focus();
    }

    function buildTabs() {
        tabStrip.innerHTML = '';
        for (var i = 0; i < files.length; i++) {
            (function (idx) {
                var tab = document.createElement('button');
                tab.type = 'button';
                tab.setAttribute('data-tab-idx', idx);

                    'white-space:nowrap', 'flex-shrink:0'

                tab.textContent = files[idx].tabLabel || (files[idx].type + '.' + files[idx].lang);
                tab.addEventListener('click', function () { loadTab(idx); });
                tabStrip.appendChild(tab);
            })(i);
        }
    }

    function doSave() {
        if (files.length === 0) return;
        files[activeIdx].pendingContent = textarea.value;

        var toSave = [];
        for (var i = 0; i < files.length; i++) {
            if (files[i].pendingContent !== undefined) {
                toSave.push({ idx: i, file: files[i] });
            }
        }
        if (toSave.length === 0) return;

        saveBtn.disabled = true;
        saveStatus.textContent = 'Saving...';

        var done = 0;
        var failed = 0;
        toSave.forEach(function (item) {
            ApiClient.ajax({
                url: ApiClient.getUrl('JellyFrame/api/cache/file') + '?path=' + encodeURIComponent(item.file.path),
                type: 'PUT',
                data: JSON.stringify({ content: item.file.pendingContent }),
                contentType: 'application/json'
            }).then(function () {
                files[item.idx].content = files[item.idx].pendingContent;
                delete files[item.idx].pendingContent;
                done++;
                if (done + failed === toSave.length) onSaveDone(failed);
            }).catch(function () {
                failed++;
                if (done + failed === toSave.length) onSaveDone(failed);
            });
        });
    }

    function onSaveDone(failCount) {
        saveBtn.disabled = false;
        if (failCount > 0) {
            saveStatus.textContent = failCount + ' file(s) failed to save';

    function selectTheme(theme) {
        var effectiveId = state.pendingId !== null ? state.pendingId : state.activeId;
        if (effectiveId === theme.id) return;

        state.pendingId = theme.id;
        el('jft-btnSave').disabled = false;
        updatePending();
        updateActiveBar();
        render();

        var hasVars = (theme.vars || []).length > 0 || (theme.addons || []).length > 0;
        if (hasVars) openVarsModal(theme);
    }

    function deactivateTheme() {
        state.pendingId = '';
        state.pendingVars = {};
        el('jft-btnSave').disabled = false;
        updatePending();
        updateActiveBar();
        render();
    }

    el('btnDeactivate').addEventListener('click', deactivateTheme);

    el('jft-btnSave').addEventListener('click', doSave);

    function doSave() {
        var newId = state.pendingId !== null ? state.pendingId : state.activeId;
        var newVars = state.pendingVars !== null ? state.pendingVars : state.themeVars;

        var cfg = Object.assign({}, state.config, {
            ThemesUrl: el('themesUrl').value.trim(),
            ActiveTheme: newId || '',
            CachedThemes: state.themes.length > 0 ? JSON.stringify(state.themes) : state.config.CachedThemes || '',
            ThemeVars: JSON.stringify(newVars || {})
        });

        el('jft-btnSave').disabled = true;
        ApiClient.updatePluginConfiguration(PLUGIN_ID, cfg).then(function () {
            state.config = cfg;
            state.activeId = newId;
            state.themeVars = newVars;
            state.pendingId = null;
            state.pendingVars = null;
            updatePending();
            updateActiveBar();
            render();
            var doReload = function () { setTimeout(function () { window.top.location.reload(true); }, 300); };
            if (window.caches) {
                caches.keys().then(function (keys) {
                    return Promise.all(
                        keys.filter(function (k) { return k.startsWith('modmanager-'); })
                            .map(function (k) { return caches.delete(k); })
                    );
                }).then(doReload).catch(doReload);
            } else {
                doReload();
            }
        }).catch(function () {
            el('jft-btnSave').disabled = false;
        });
    }

    function currentId() { return state.pendingId !== null ? state.pendingId : state.activeId; }
    function currentVars() { return state.pendingVars !== null ? state.pendingVars : state.themeVars; }

    function switchThemeTab(name) {
        var panels = { themes: 'tabThemes', settings: 'jft-tabSettings' };
        Object.keys(panels).forEach(function (k) {
            var panel = document.getElementById(panels[k]);
            if (panel) panel.style.display = k === name ? '' : 'none';
        });
        var jftRoot = document.querySelector('.jfThemePage') || document;
        jftRoot.querySelectorAll('.jfThemeTab').forEach(function (btn) {
            var tabKey = btn.getAttribute('data-tab') || btn.dataset.tab;
            var active = tabKey === name;
            btn.classList.toggle('jfThemeTabActive', active);
            btn.classList.toggle('mui-tab-active', active);
            btn.setAttribute('aria-selected', active ? 'true' : 'false');
            btn.setAttribute('tabindex', active ? '0' : '-1');
        });
        if (name === 'settings') loadThemeCacheInfo();
    }

    document.querySelectorAll('.jfThemeTab').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var tabKey = this.getAttribute('data-tab') || this.dataset.tab;
            if (tabKey) switchThemeTab(tabKey);
        });
    });

    function formatCacheDate(d) {
        if (!d || isNaN(d.getTime()) || d.getTime() === 0) return '\u2014';
        var now = new Date();
        var diffMs = now - d;
        var diffMin = Math.floor(diffMs / 60000);
        var diffHr = Math.floor(diffMin / 60);
        var diffDay = Math.floor(diffHr / 24);
        var rel = '';
        if (diffMin < 1) rel = 'just now';
        else if (diffMin < 60) rel = diffMin + 'm ago';
        else if (diffHr < 24) rel = diffHr + 'h ago';
        else if (diffDay < 30) rel = diffDay + 'd ago';
        else rel = d.toLocaleDateString();
        return rel + ' (' + d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ')';
    }

    function loadThemeCacheInfo() {
        var infoBar = document.getElementById('themeCacheInfoBar');
        var list = document.getElementById('themeCacheList');
        var purgeSel = document.getElementById('btnPurgeSelectedThemes');
        infoBar.textContent = 'Loading\u2026';
        list.innerHTML = '';
        selectedThemeCacheIds = [];
        if (purgeSel) purgeSel.disabled = true;

        ApiClient.ajax({ url: ApiClient.getUrl('JellyFrame/api/themes/cache'), type: 'GET', dataType: 'json' })
            .then(function (data) {
                var kb = (data.totalBytes / 1024).toFixed(1);
                infoBar.textContent = data.fileCount + ' file(s) \u00b7 ' + kb + ' KB  \u2014  ' + data.cacheDir;

                var grouped = {};
                (data.entries || []).forEach(function (e) {
                    var key = e.themeId || 'unknown';
                    if (!grouped[key]) grouped[key] = [];
                    grouped[key].push(e);
                });

                if (Object.keys(grouped).length === 0) {
                    list.innerHTML = '<div style="font-size:0.8125rem;color:rgba(255,255,255,0.5);padding:8px 0;">Cache is empty.</div>';
                    return;
                }

                Object.keys(grouped).sort().forEach(function (themeId) {
                    var files = grouped[themeId];
                    var kb2 = (files.reduce(function (s, f) { return s + f.sizeBytes; }, 0) / 1024).toFixed(1);
                    var latestTimestamp = Math.max.apply(null, files.map(function (f) {
                        return f.modified ? new Date(f.modified).getTime() : 0;
                    }));
                    var latestDate = latestTimestamp > 0 ? new Date(latestTimestamp) : null;

                    var row = document.createElement('div');
                    row.style.cssText = 'display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);cursor:pointer;user-select:none;transition:background-color 150ms;';

                    var chk = document.createElement('input');
                    chk.type = 'checkbox';
                    chk.style.cssText = 'flex-shrink:0;accent-color:#90caf9;cursor:pointer;width:16px;height:16px;';
                    chk.addEventListener('change', function () {
                        if (chk.checked) {
                            if (!selectedThemeCacheIds.includes(themeId)) selectedThemeCacheIds.push(themeId);
                        } else {
                            selectedThemeCacheIds = selectedThemeCacheIds.filter(function (x) { return x !== themeId; });
                        }
                        if (purgeSel) purgeSel.disabled = selectedThemeCacheIds.length === 0;
                    });

                    var label = document.createElement('div');
                    label.style.cssText = 'flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;';

                    var badgesHtml = '';
                    var hasBase = files.some(function (f) { return (f.type === 'base' || !f.type) && !f.isCompiled; });
                    var hasCompiled = files.some(function (f) { return f.isCompiled; });
                    var addonFiles = files.filter(function (f) { return f.type === 'addon' || f.addonId; });

                    if (hasBase) {
                        badgesHtml += '<span style="display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(144,202,249,0.12);color:#90caf9;font-size:0.7rem;font-weight:600;">BASE</span>';
                    }
                    if (hasCompiled) {
                        badgesHtml += '<span style="display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(206,147,216,0.15);color:#ce93d8;font-size:0.7rem;font-weight:600;">CONFIGURED</span>';
                    }
                    if (addonFiles.length > 0) {
                        var addonNames = [];
                        addonFiles.forEach(function (f) {
                            var aName = f.addonId ? f.addonId : 'ADDON';
                            if (!addonNames.includes(aName)) addonNames.push(aName);
                        });
                        badgesHtml += '<span style="display:inline-block;padding:1px 6px;border-radius:4px;background:rgba(102,187,106,0.15);color:#66bb6a;font-size:0.7rem;font-weight:600;">+' + escHtml(addonNames.join(', ')).toUpperCase() + '</span>';
                    }

                    var topRow = '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;">'
                        + '<span style="font-weight:600;font-size:0.875rem;color:rgba(255,255,255,0.87);">' + escHtml(themeId) + '</span>'
                        + '<span style="color:rgba(255,255,255,0.5);font-size:0.75rem;">v' + escHtml(files[0].version || '1.0.0') + '</span>'
                        + badgesHtml
                        + '</div>';

                    var bottomRow = '<div style="font-size:0.75rem;color:rgba(255,255,255,0.5);display:flex;align-items:center;gap:12px;flex-wrap:wrap;">'
                        + '<span>Cached: ' + escHtml(formatCacheDate(latestDate)) + '</span>'
                        + '<span>' + files.length + ' file' + (files.length > 1 ? 's' : '') + '</span>'
                        + '</div>';

                    label.innerHTML = topRow + bottomRow;

                    var size = document.createElement('div');
                    size.style.cssText = 'font-size:0.8125rem;font-weight:500;color:rgba(255,255,255,0.7);flex-shrink:0;font-variant-numeric:tabular-nums;';
                    size.textContent = kb2 + ' KB';

                    row.appendChild(chk);
                    row.appendChild(label);
                    row.appendChild(size);
                    row.addEventListener('click', function (e) {
                        if (e.target !== chk) chk.checked = !chk.checked;
                        chk.dispatchEvent(new Event('change'));
                    });
                    list.appendChild(row);
                });
            })
            .catch(function () {
                infoBar.textContent = 'Failed to load theme cache info.';
            });
    }

    function doPurgeThemes(themeIds) {
        var resultEl = document.getElementById('themeCacheResult');
        var body = themeIds && themeIds.length > 0 ? JSON.stringify({ themeIds: themeIds }) : '{}';
        ApiClient.ajax({
            url: ApiClient.getUrl('JellyFrame/api/themes/cache/purge'),
            type: 'POST',
            data: body,
            contentType: 'application/json',
            dataType: 'json'
        }).then(function (res) {
            if (resultEl) {
                resultEl.style.display = '';
                resultEl.style.color = '#66bb6a';
                resultEl.textContent = '\u2713 Purged. Cache will rebuild on next page load.';
                setTimeout(function () { resultEl.style.display = 'none'; }, 4000);
            }
            selectedThemeCacheIds = [];
            loadThemeCacheInfo();
        }).catch(function () {
            if (resultEl) {
                resultEl.style.display = '';
                resultEl.style.color = '#f44336';
                resultEl.textContent = '\u2717 Purge failed. Check that you are logged in as admin.';
            }
        });
    }

    document.getElementById('btnPurgeAllThemes').addEventListener('click', function () {
        if (confirm('Purge the entire theme cache? All themes will re-download on next page load.'))
            doPurgeThemes([]);
    });
    document.getElementById('btnPurgeSelectedThemes').addEventListener('click', function () {
        if (selectedThemeCacheIds.length === 0) return;
        if (confirm('Purge cache for: ' + selectedThemeCacheIds.join(', ') + '?'))
            doPurgeThemes(selectedThemeCacheIds);
    });
    document.getElementById('btnRefreshThemeCache').addEventListener('click', loadThemeCacheInfo);
})();

        </script>

    </div>
</body>

</html>
